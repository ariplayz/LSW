[workspace]
members = [
  "crates/lsw-lib",
  "crates/lsw-qemu",
  "crates/lswd",
  "crates/lsw-cli",
  "crates/lsw-tests"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "5"
hex = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.29", features = ["signal"] }
prost = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "net", "signal"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.12", features = ["transport"] }
tower = "0.5"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.dependencies.protoc-bin-vendored]
version = "3"
